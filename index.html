<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F5F6F8" />
  <meta name="color-scheme" content="light dark" />
  <title>Python Quest</title>
  <meta name="description" content="Learn Python from zero to hero. Ten modules, graded exercises and a real Python interpreter running in your browser — nothing to install." />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="assets/styles.css" />
  <script>
    // avoid a flash of the wrong theme before main.js runs
    try {
      var t = JSON.parse(localStorage.getItem("pyquest.v1") || "{}").settings?.theme;
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      else if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.theme = "dark";
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <header class="topbar">
    <button class="icon-btn menu-btn" data-toggle-sidebar aria-label="Toggle curriculum">☰</button>
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2c-4 0-5.5 1.8-5.5 4.2V9h5.3v.9H5.2C2.9 9.9 1.5 11.6 1.5 14.1c0 2.4 1.3 4.1 3.4 4.1h1.8v-2.6c0-2.3 1.9-4 4.2-4h5c1.9 0 3.5-1.5 3.5-3.4V6.2C19.4 3.8 17.9 2 12 2zM9.4 4.6a1 1 0 110 2 1 1 0 010-2z" fill="currentColor"/><path d="M12 22c4 0 5.5-1.8 5.5-4.2V15h-5.3v-.9h6.6c2.3 0 3.7-1.7 3.7-4.2 0-2.4-1.3-4.1-3.4-4.1h-1.8v2.6c0 2.3-1.9 4-4.2 4h-5c-1.9 0-3.5 1.5-3.5 3.4v1.9C4.6 20.2 6.1 22 12 22zm2.6-2.6a1 1 0 110-2 1 1 0 010 2z" fill="currentColor" opacity=".55"/></svg></span>
      <span class="brand-text">Python&nbsp;Quest</span>
    </a>

    <nav class="top-nav" aria-label="Primary">
      <a href="#/" data-nav="home">Dashboard</a>
      <a href="#/review" data-nav="review">Recall<span class="nav-badge" data-review-badge hidden>0</span></a>
      <a href="#/playground" data-nav="playground">Playground</a>
      <a href="#/reference" data-nav="reference">Cheat sheet</a>
      <a href="#/progress" data-nav="progress">Progress</a>
      <a href="#/science" data-nav="science">Why it works</a>
    </nav>

    <button class="search-btn" data-open-search title="Search lessons (press /)">
      <span>Search lessons</span><kbd>/</kbd>
    </button>

    <span class="runtime booting" id="runtime-status" title="The Python interpreter"><span class="dot"></span>Starting Python…</span>

    <a class="hud-streak" href="#/progress" id="hud-streak" title="Day streak">
      <span class="flame">🔥</span><b>0</b>
    </a>

    <a class="hud-level" href="#/progress" id="hud-level" title="Level and XP">
      <span class="hud-lvl" id="hud-lvl">Lv 1</span>
      <span class="hud-xpbar"><i id="hud-xpbar-fill"></i></span>
      <span class="hud-xp" id="hud-xp">0 XP</span>
    </a>

    <div class="top-progress" id="top-progress" title="Course progress">
      <svg viewBox="0 0 36 36" class="ring" aria-hidden="true">
        <circle class="ring-bg" cx="18" cy="18" r="15.5" />
        <circle class="ring-fg" cx="18" cy="18" r="15.5" id="ring-fg" />
      </svg>
      <span id="ring-label">0%</span>
    </div>

    <button class="icon-btn" id="theme-btn" aria-label="Toggle colour theme" title="Toggle theme">◐</button>
  </header>

  <div class="layout">
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <aside class="sidebar" id="sidebar" aria-label="Curriculum">
      <div class="sidebar-head">
        <span class="eyebrow">Curriculum</span>
        <button class="icon-btn small" data-toggle-sidebar aria-label="Close">✕</button>
      </div>
      <div class="sidebar-inner" id="sidebar-inner">
        <div class="sidebar-loading">Loading curriculum…</div>
      </div>
    </aside>
    <main class="view" id="view" tabindex="-1">
      <div class="boot"><div class="spinner"></div></div>
    </main>
  </div>

  <nav class="tabbar" aria-label="Sections">
    <a href="#/" data-nav="home"><span class="ico">⌂</span>Home</a>
    <a href="#" data-toggle-sidebar data-nav="learn"><span class="ico">≡</span>Lessons</a>
    <a href="#/review" data-nav="review"><span class="ico">↻</span>Recall<span class="nav-badge" data-review-badge hidden>0</span></a>
    <a href="#/playground" data-nav="playground"><span class="ico">▸</span>Play</a>
    <a href="#/progress" data-nav="progress"><span class="ico">◔</span>Progress</a>
  </nav>

  <div class="palette-backdrop" id="palette-backdrop" hidden>
    <div class="palette" role="dialog" aria-modal="true" aria-label="Search lessons">
      <input type="text" id="palette-input" placeholder="Search lessons, keywords, Python features…" autocomplete="off" spellcheck="false" />
      <ul class="palette-results" id="palette-results"></ul>
      <div class="palette-foot"><kbd>↑</kbd><kbd>↓</kbd> navigate · <kbd>↵</kbd> open · <kbd>esc</kbd> close</div>
    </div>
  </div>

  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
